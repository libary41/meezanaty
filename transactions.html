<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزانيتي - المعاملات</title>
</head>

<body>

    <header>

        <h1>ميزانيتي</h1>

        <nav>
            <a href="index.html">الرئيسية</a> |
            <a href="transactions.html">المعاملات</a> |
            <a href="budgets.html">الميزانيات</a> |
            <a href="goals.html">الأهداف المالية</a> |
            <a href="reports.html">التقارير</a> |
            <a href="about.html">من نحن</a> |
            <a href="contact.html">تواصل معنا</a>
        </nav>

    </header>

    <main>

        <h2>المعاملات المالية</h2>

        <section>

            <h3>إضافة معاملة جديدة</h3>

            <form>

                <label>نوع العملية:</label>
                <br>

                <select name="type">
                    <option value="income">دخل</option>
                    <option value="expense">مصروف</option>
                </select>

                <br><br>

                <label>المبلغ:</label>
                <br>

                <input type="number" name="amount">

                <br><br>

                <label>التصنيف:</label>
                <br>

                <select name="category">
                    <option>طعام</option>
                    <option>مواصلات</option>
                    <option>تعليم</option>
                    <option>تسوق</option>
                    <option>فواتير</option>
                    <option>ترفيه</option>
                    <option>أخرى</option>
                </select>

                <br><br>

                <label>الملاحظة:</label>
                <br>

                <textarea name="note"></textarea>

                <br><br>

                <label>التاريخ:</label>
                <br>

                <input type="date" name="date">

                <br><br>

                <button type="submit">حفظ المعاملة</button>

            </form>

        </section>

        <section>

            <h3>آخر المعاملات</h3>

            <table border="1">

                <tr>
                    <th>النوع</th>
                    <th>المبلغ</th>
                    <th>التصنيف</th>
                    <th>الملاحظة</th>
                    <th>التاريخ</th>
                </tr>

                <tr>
                    <td>مصروف</td>
                    <td>50</td>
                    <td>تعليم</td>
                    <td>شراء كتاب</td>
                    <td>2026-10-08</td>
                </tr>

            </table>

        </section>

    </main>

</body>
</html>
